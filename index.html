<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/quran-lessons-10/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="القراءات العشر — Ten Qiraat study app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="القراءات العشر">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>القراءات العشر</title>
  <link rel="manifest" href="manifest.json">

  <!-- What shows until the app's first frame, or if it can't start. -->
  <style>
    :root { --paper: #F7F7F1; --ink: #173B35; --muted: #536C66; --gold: #C69C59; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #0D1C1A; --ink: #F1F6F0; --muted: #C1D1C9; --gold: #DAB577; }
    }
    html, body { margin: 0; height: 100%; background: var(--paper); }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      padding: 0 24px; text-align: center; color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    #loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(198, 156, 89, .3);
      border-top-color: var(--gold); animation: spin 1s linear infinite;
    }
    #loading .error, #loading.failed .spinner, #loading.failed .wait { display: none; }
    #loading.failed .error { display: block; }
    #loading small { display: block; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <div class="wait">جارٍ تحميل القراءات العشر…<small lang="en" dir="ltr">Loading…</small></div>
    <div class="error">
      تعذّر تشغيل التطبيق في هذا المتصفح. حدّث الصفحة، أو حدّث المتصفح، أو جرّب متصفحًا آخر.
      <small lang="en" dir="ltr">The app couldn't start in this browser. Reload, update your browser, or try another one.</small>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline: sw.js keeps a copy of the app once it has opened online. Only
    // release builds have a version, so `flutter run` registers nothing.
    const offlineVersion = "3224821693" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
    if ('serviceWorker' in navigator && offlineVersion) {
      // The engine this browser loads: Flutter's own test (flutter.js).
      const engine =
        typeof ImageDecoder !== 'undefined' &&
        typeof Intl.v8BreakIterator !== 'undefined' &&
        typeof Intl.Segmenter !== 'undefined'
          ? 'chromium'
          : 'full';
      // Registered once the app is on screen: by then the browser has the
      // engine, fonts and data, so the worker's copy mostly costs 304s, and
      // `load` can come too late on a slow network (it waits for main.dart.js).
      window.addEventListener('flutter-first-frame', async () => {
        try {
          await navigator.serviceWorker.register(
            `sw.js?v=${offlineVersion}&engine=${engine}`,
          );
        } catch (_) {
          // Offline, the browser can't check for a new worker; the one it
          // has keeps serving.
          return;
        }
        // Tell the worker what the page loaded, in case it missed something.
        const registration = await navigator.serviceWorker.ready;
        registration.active?.postMessage({
          type: 'cache',
          urls: performance.getEntriesByType('resource').map((e) => e.name),
        });
      });
    }
  </script>
</body>
</html>
